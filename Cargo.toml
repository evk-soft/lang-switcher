[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
switcher-core = { path = "crates/switcher-core" }
switcher-platform = { path = "crates/switcher-platform" }
switcher-windows = { path = "crates/switcher-windows" }

serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
thiserror = "2.0"
anyhow = "1.0"
crossbeam-channel = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
directories = "6.0"
# Every dependency below is trimmed per ADR-0008: default features pulled in decoders,
# PNG and variable-font machinery that M1 never uses, against a 1-4 MB binary budget.
# `muda` is reached through `tray_icon::menu`, so it is deliberately not a direct
# dependency; `embed-manifest` is gone because the PMv2 manifest is embedded via linker
# flags from switcher-app's build.rs (ADR-0010).
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }
rodio = { version = "0.22", default-features = false, features = ["playback"] }
tray-icon = { version = "0.24", default-features = false }
# The only default feature of `windows` is `std`, and it is needed.
windows = "0.62"
windows-core = { version = "0.62", default-features = false, features = ["std"] }

# NOTE (ADR-0007): `panic = "abort"` is forbidden in every profile — it is a PRECONDITION
# of the hook-thread supervisor, not the whole mechanism. `catch_unwind` around a thread
# body only observes panics raised in Rust frames. The hook work itself runs inside our own
# `extern "system"` callbacks (wndproc, WINEVENTPROC), and since Rust 1.81 an unwind that
# reaches a non-`-unwind` `extern` boundary aborts the process, so the outer `catch_unwind`
# never sees it. Every such callback must therefore guard its own body and return a default
# result; only then does the documented backoff-and-degrade path exist at all.

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
