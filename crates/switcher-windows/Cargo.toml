[package]
name = "switcher-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[example]]
name = "overlay_smoke"
test = true

[target.'cfg(windows)'.dependencies]
switcher-platform = { workspace = true }
crossbeam-channel = { workspace = true }
tracing = { workspace = true }
windows-core = { workspace = true }
# One feature per group of calls that needs it, added with the code that needs it
# (ADR-0008). Removing any of these must break the build — that is the check.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_Globalization",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_Audio",
    # Read-only audio routing/volume diagnostics, emitted only at DEBUG level.
    "Win32_Media_Audio_Endpoints",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_TextServices",
    "Win32_System_Registry",
    # RegCreateKeyExW includes SECURITY_ATTRIBUTES, even when supplied as None.
    "Win32_Security",
    # `WNDCLASSW` carries an `HBRUSH`, so the struct and `RegisterClassW` are gated on Gdi
    # even though they live in WindowsAndMessaging.
    "Win32_Graphics_Gdi",
    # dpi.rs: SetProcessDpiAwarenessContext, GetDpiAwarenessContextForProcess,
    # AreDpiAwarenessContextsEqual, GetAwarenessFromDpiAwarenessContext.
    "Win32_UI_HiDpi",
    # GetCurrentThreadId (win_util), GetCurrentProcess (dpi).
    "Win32_System_Threading",
    # GetModuleHandleW for the window class' HINSTANCE.
    "Win32_System_LibraryLoader",
] }

[target.'cfg(windows)'.dev-dependencies]
tray-icon = { workspace = true }
# The examples are this crate's only smoke harness: no unit test can see click-through,
# focus theft or a monitor crossing. They need a subscriber installed, or the very log lines
# the checklist asks the reader to look for would go nowhere.
tracing-subscriber = { workspace = true }

[lints]
workspace = true
