[package]
name = "switcher-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[target.'cfg(windows)'.dependencies]
switcher-platform = { workspace = true }
crossbeam-channel = { workspace = true }
tracing = { workspace = true }
# One feature per group of calls that needs it, added with the code that needs it
# (ADR-0008). Removing any of these must break the build — that is the check.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # `WNDCLASSW` carries an `HBRUSH`, so the struct and `RegisterClassW` are gated on Gdi
    # even though they live in WindowsAndMessaging.
    "Win32_Graphics_Gdi",
    # dpi.rs: SetProcessDpiAwarenessContext, GetDpiAwarenessContextForProcess,
    # AreDpiAwarenessContextsEqual, GetAwarenessFromDpiAwarenessContext.
    "Win32_UI_HiDpi",
    # GetCurrentThreadId (win_util), GetCurrentProcess (dpi).
    "Win32_System_Threading",
    # GetModuleHandleW for the window class' HINSTANCE.
    "Win32_System_LibraryLoader",
] }

[target.'cfg(windows)'.dev-dependencies]
# The examples are this crate's only smoke harness: no unit test can see click-through,
# focus theft or a monitor crossing. They need a subscriber installed, or the very log lines
# the checklist asks the reader to look for would go nowhere.
tracing-subscriber = { workspace = true }

[lints]
workspace = true
